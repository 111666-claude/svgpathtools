<?xml version="1.0" ?>
<svg
    baseProfile="full"
    version="1.1"
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg"
    fill="gray"
    stroke="black"
    stroke-width="1">

  <!-- fill on the parent group, opacity on the child group:
       the designer's "lost preview color" scenario -->
  <g id="fill-parent" fill="red" stroke="blue" stroke-width="2">
    <g id="opacity-child" opacity="0.5">
      <path id="p-inherit" d="M 0,0 L 10,0"/>
      <!-- local presentation attribute overrides the inherited fill -->
      <path id="p-override" d="M 0,1 L 10,1" fill="green"/>
      <!-- inline style overrides both the attribute and the inheritance -->
      <path id="p-style" d="M 0,2 L 10,2" fill="purple"
            style="fill: orange; stroke-width: 4; visibility: hidden"/>
      <!-- visibility can be re-enabled on a descendant -->
      <g id="visibility-hidden" visibility="hidden">
        <path id="p-hidden" d="M 0,3 L 10,3"/>
        <path id="p-visible-again" d="M 0,4 L 10,4" visibility="visible"/>
      </g>
    </g>
  </g>

  <!-- display:none on an ancestor hides the whole subtree and cannot
       be re-enabled by descendants -->
  <g id="display-none" display="none">
    <path id="p-display-none" d="M 0,5 L 10,5"/>
    <g id="display-inline-child" display="inline">
      <path id="p-display-none-nested" d="M 0,6 L 10,6"/>
    </g>
  </g>

  <!-- cumulative opacity multiplies down the chain -->
  <g id="opacity-outer" opacity="0.5">
    <g id="opacity-inner" opacity="0.4">
      <path id="p-opacity" d="M 0,7 L 10,7" opacity="0.5"/>
    </g>
  </g>

  <!-- invalid values are ignored; inherited/default values are used -->
  <g id="invalid-group" fill="not-a-color" stroke-width="-3" opacity="2">
    <path id="p-invalid" d="M 0,8 L 10,8" stroke="##bad" opacity="bogus"/>
    <path id="p-missing" d="M 0,9 L 10,9"/>
  </g>

  <!-- duplicate ids: both paths must be returned with their own styles -->
  <path id="dup" d="M 0,10 L 10,10" fill="teal"/>
  <g id="dup-group" fill="navy">
    <path id="dup" d="M 0,11 L 10,11"/>
  </g>

</svg>
